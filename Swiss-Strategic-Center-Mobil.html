<html lang="de-CH">

<title>Swiss Strategic Center</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23ff2d3a'/%3E%3Cpath d='M13 6h6v7h7v6h-7v7h-6v-7H6v-6h7z' fill='%23fff'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root { --bg: #0a0a0a; --glass: rgba(16,18,24,.82); --line: rgba(255,255,255,.09); --text: #e8eaf0; --muted: #8a90a2;
    --ch: #ff2d3a; --cyan: #5ee7ff; --red: #ff4d6d; --amber: #ffb547; --green: #3ee6a8; --nav: 62px; --top: 52px; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; overflow: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  a { color: #9fdcff; }
  .glass { background: var(--glass); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--line); }
  .muted { color: var(--muted); } .mono { font-family: ui-monospace, "JetBrains Mono", Consolas, monospace; }
  .dot { width: 8px; height: 8px; border-radius: 9px; display: inline-block; flex: none; }
  .chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; padding: 3px 8px; border-radius: 99px; border: 1px solid var(--line); background: rgba(255,255,255,.04); white-space: nowrap; }
  .chip.btn { cursor: pointer; } .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .meter { display: inline-flex; gap: 2px; vertical-align: middle; } .meter i { width: 11px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.13); }
  #top { position: fixed; top: 0; left: 0; right: 0; height: calc(var(--top) + env(safe-area-inset-top)); padding: env(safe-area-inset-top) 12px 0; display: flex; align-items: center; gap: 10px; z-index: 1000; border-width: 0 0 1px; }
  #top .brand { display: flex; align-items: center; gap: 9px; min-width: 0; flex: 1; }
  #top .brand b { font-size: 13px; letter-spacing: .06em; white-space: nowrap; }
  #top .brand small { display: block; font-size: 10.5px; color: var(--muted); }
  .iconbtn { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; border: 1px solid var(--line); background: rgba(255,255,255,.04); font-size: 16px; }
  #ticker { position: fixed; top: calc(var(--top) + env(safe-area-inset-top)); left: 0; right: 0; height: 30px; z-index: 999; overflow: hidden; display: flex; align-items: center; font-size: 12px; border-width: 0 0 1px; }
  #ticker .lbl { padding: 0 10px; font-weight: 700; font-size: 10.5px; letter-spacing: .14em; color: var(--red); flex: none; }
  #ticker .track { display: inline-flex; gap: 28px; white-space: nowrap; padding-left: 100%; animation: tick 95s linear infinite; }
  #ticker:hover .track { animation-play-state: paused; }
  #ticker .tag { color: var(--cyan); font-weight: 600; font-size: 10.5px; margin-right: 6px; }
  @keyframes tick { to { transform: translateX(-100%); } }
  #map { position: fixed; top: calc(var(--top) + 30px + env(safe-area-inset-top)); left: 0; right: 0; bottom: calc(var(--nav) + env(safe-area-inset-bottom)); background: #0a0a0a; }
  .leaflet-container { background: #0a0a0a; font: inherit; }
  .leaflet-control-attribution { background: rgba(10,10,10,.6) !important; color: #777 !important; font-size: 9px !important; }
  .leaflet-control-attribution a { color: #999 !important; }
  .leaflet-bar a { background: var(--glass) !important; color: var(--text) !important; border-color: var(--line) !important; }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: rgba(16,18,24,.95); color: var(--text); }
  .leaflet-popup-content { margin: 10px 12px; font-size: 12.5px; }
  nav#tabs { position: fixed; left: 0; right: 0; bottom: 0; height: calc(var(--nav) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); display: grid; grid-template-columns: repeat(6, 1fr); z-index: 1001; border-width: 1px 0 0; }
  nav#tabs button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 10px; color: var(--muted); padding: 4px 1px; }
  nav#tabs button span { font-size: 15px; line-height: 1; }
  nav#tabs button.on { color: var(--text); }
  nav#tabs button.on span { filter: drop-shadow(0 0 6px rgba(255,45,58,.6)); }
  #panel { position: fixed; left: 0; right: 0; bottom: calc(var(--nav) + env(safe-area-inset-bottom)); max-height: 68vh; z-index: 1000; border-radius: 18px 18px 0 0; border-width: 1px 1px 0; display: flex; flex-direction: column; transform: translateY(110%); transition: transform .32s cubic-bezier(.2,.8,.2,1); }
  #panel.open { transform: none; }
  #panel .grab { width: 40px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.25); margin: 8px auto 2px; flex: none; }
  #phead { display: flex; align-items: center; gap: 8px; padding: 4px 14px 8px; flex: none; }
  #phead h2 { font-size: 16px; margin: 0; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #pbody { overflow-y: auto; padding: 0 14px 16px; -webkit-overflow-scrolling: touch; }
  .card { border: 1px solid var(--line); background: rgba(255,255,255,.03); border-radius: 13px; padding: 11px 12px; margin-top: 9px; }
  .card h4 { margin: 0 0 6px; font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .card p { margin: 0; font-size: 13.2px; color: #d5d9e3; }
  .card.ch { border-color: rgba(255,45,58,.38); background: linear-gradient(135deg, rgba(255,45,58,.1), rgba(255,255,255,.02)); }
  .row { display: flex; gap: 9px; align-items: flex-start; padding: 9px 2px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .row:last-child { border-bottom: 0; } .row:active { background: rgba(255,255,255,.04); }
  .row .t { font-size: 13.5px; font-weight: 600; line-height: 1.3; } .row .s { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .row .dot { margin-top: 5px; }
  .ptabs { display: flex; gap: 14px; overflow-x: auto; border-bottom: 1px solid var(--line); margin: 2px 0 2px; scrollbar-width: none; }
  .ptabs button { padding: 8px 0; font-size: 12.5px; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
  .ptabs button.on { color: var(--text); border-color: var(--cyan); }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
  .kpi { border: 1px solid var(--line); border-radius: 11px; padding: 8px 9px; background: rgba(255,255,255,.03); }
  .kpi .l { font-size: 9.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); line-height: 1.2; }
  .kpi .v { font-size: 18px; font-weight: 700; margin-top: 2px; } .kpi .n { font-size: 9.5px; color: var(--muted); line-height: 1.2; }
  .tl { border-left: 1px solid var(--line); margin: 4px 0 0 4px; padding-left: 12px; }
  .tl > div { position: relative; padding: 5px 0; font-size: 12.8px; }
  .tl > div::before { content: ""; position: absolute; left: -16px; top: 11px; width: 7px; height: 7px; border-radius: 7px; background: var(--c, var(--red)); }
  .tl .d { font-size: 10.5px; color: var(--muted); }
  #search { width: 100%; padding: 10px 12px; border-radius: 11px; border: 1px solid var(--line); background: rgba(255,255,255,.05); color: var(--text); font-size: 15px; outline: none; }
  .flag { height: 14px; border-radius: 2px; vertical-align: -2px; box-shadow: 0 0 0 1px rgba(255,255,255,.12); }
  #legend { position: fixed; right: 10px; top: calc(var(--top) + 40px + env(safe-area-inset-top)); z-index: 998; border-radius: 12px; padding: 7px 9px; font-size: 10.5px; display: none; }
  #legend div { display: flex; align-items: center; gap: 6px; padding: 1px 0; }
  #toast { position: fixed; left: 50%; top: calc(var(--top) + 40px + env(safe-area-inset-top)); transform: translate(-50%, -8px); opacity: 0; z-index: 1100; padding: 8px 12px; border-radius: 11px; font-size: 12.5px; transition: .3s; pointer-events: none; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #loading { position: fixed; inset: 0; z-index: 2000; background: #0a0a0a; display: grid; place-items: center; text-align: center; transition: opacity .5s; }
  #loading.hide { opacity: 0; pointer-events: none; }
  /* PC: Panel als Seitenleiste links, Navigation oben */
  @media (min-width: 820px) {
    :root { --nav: 0px; }
    #ticker { left: 400px; }
    #map { left: 400px; top: calc(var(--top) + 30px); bottom: 0; }
    #panel { top: var(--top); bottom: 0; left: 0; right: auto; width: 400px; max-height: none; border-radius: 0; border-width: 0 1px 0 0; transform: none; }
    #panel .grab { display: none; }
    nav#tabs { position: fixed; top: 9px; bottom: auto; left: auto; right: 64px; width: 560px; height: 36px; padding: 0; border: 1px solid var(--line); border-radius: 11px; grid-template-columns: repeat(6, 1fr); }
    nav#tabs button { flex-direction: row; gap: 4px; font-size: 11px; } nav#tabs button span { font-size: 13px; }
    #legend { display: block; }
  }
</style>
</head>

      <div class="chips" style="margin-top:8px">${(SW.mandates || []).map(m => `<span class="chip">${esc(m)}</span>`).join('')}</div></div>
    <div class="chips" style="margin-top:10px">${[['Schweiz auf Karte', 'CHE']].map(([l]) => `<button class="chip btn" id="flyCH">📍 ${l}</button>`).join('')}<button class="chip btn" data-co="CHE">Dossier Schweiz</button></div>`);
  $('#flyCH').onclick = () => { map.flyToBounds([[45.8, 5.9], [47.85, 10.5]], { duration: 1.2 }); if (innerWidth < 820) $('#panel').classList.remove('open'); };
}
function viewFind() {
  const all = Object.keys(D.CO).filter(k => D.names[k]).map(k => [k, nameOf(k)]).sort((a, b) => a[1].localeCompare(b[1], 'de'));
  openPanel('Länder & Suche', `<input id="search" placeholder="Land oder Konflikt suchen …" autocomplete="off"><div class="card" style="padding:2px 10px" id="flist"></div>`);
  const render = (q) => {
    q = (q || '').toLowerCase();
    const cs = D.C.filter(c => q && c.name.toLowerCase().includes(q)).map(c => `<div class="row" data-c="${c.id}"><span class="dot" style="background:${INT_COL[c.intensity]}"></span><div><div class="t">${esc(c.name)}</div><div class="s">Konflikt</div></div></div>`);
    const ls = all.filter(([, n]) => !q || n.toLowerCase().includes(q)).map(([k, n]) => { const d = D.CO[k]; return `<div class="row" data-co="${k}">${flag(a2Of(k), 16) || '<span class="dot"></span>'}<div style="flex:1"><div class="t">${esc(n)}</div></div>
      <div class="s" style="text-align:right">Lage ${meter(d.r || 1, RISK_COL[d.r || 1])}<br>CH ${meter(d.x || 1, '#ff2d3a')}</div></div>`; });
    $('#flist').innerHTML = [...cs, ...ls].join('') || '<div class="muted" style="padding:10px">Keine Treffer</div>';
    bindLinks();
  };
  $('#search').oninput = (e) => render(e.target.value); render('');
}
function openCountry(a3) {
  push(() => {
    const d = D.CO[a3] || {}, n = nameOf(a3), r = d.r || 1, x = d.x || 1;
    const conf = D.C.filter(c => c.countries.includes(a3));
    const evs = D.E.map((e, i) => [e, i]).filter(([e]) => (e._a3 ||= (countryAt(e.coords) || nearestOf(e.coords, (D.C.find(c => c.id === e.c) || {}).countries || []))) === a3)
      .sort((a, b) => (b[0].d || '').localeCompare(a[0].d || '')).map(([, i]) => i);
    const tabs = { Lage: `
        <div class="card"><h4>Aktuell wichtig</h4>${(d.now || []).length ? `<div class="tl">${d.now.map(t => `<div style="--c:${RISK_COL[r]}">${esc(t)}</div>`).join('')}</div>` : `<p>${esc(val(d.dom) || 'Keine besonderen Entwicklungen.')}</p>`}</div>
        ${conf.length ? `<div class="card" style="padding-bottom:4px"><h4>Konflikte & Krisen</h4>${conf.map(c => `<div class="row" data-c="${c.id}"><span class="dot" style="background:${INT_COL[c.intensity]}"></span><div><div class="t">${esc(c.name)}</div><div class="s">${esc(c.status)}</div></div></div>`).join('')}</div>` : ''}
        ${evs.length ? `<div class="card" style="padding-bottom:4px"><h4>Getroffene Orte (${evs.length})</h4>${evs.map(evRow).join('')}</div>` : ''}`,
      Schweiz: `<div class="card ch"><h4>Bedeutung für die Schweiz</h4><div style="margin-bottom:6px;font-size:11.5px" class="muted">Relevanz ${meter(x, '#ff2d3a')} · Lage ${meter(r, RISK_COL[r])} <span style="color:${RISK_COL[r]}">${RISK_TXT[r]}</span></div>
          <p>${esc(val(d.ch) || 'Geringe direkte Bezüge; Kontakte über regionale Botschaften und das Internationale Genf.')}</p>${(d.tags || []).length ? `<div class="chips" style="margin-top:8px">${d.tags.map(t => `<span class="chip" style="color:#ffd6d9;border-color:rgba(255,45,58,.35)">${esc(t)}</span>`).join('')}</div>` : ''}</div>
        ${conf.filter(c => D.imp[c.id]).map(c => `<div class="card"><h4>${esc(c.name)}</h4><p>${esc(D.imp[c.id])}</p></div>`).join('')}
        <div class="card"><h4>Reisen</h4><p>Massgebend sind die <a href="https://www.eda.admin.ch/eda/de/home/vertretungen-und-reisehinweise.html" target="_blank" rel="noopener">EDA-Reisehinweise</a>.</p></div>`,
      Politik: `<div class="card"><h4>System</h4><p>${esc(val(d.sys) || '—')}</p></div><div class="card"><h4>Führung</h4><p>${esc(val(d.head) || '—')}<br>${esc(val(d.gov) || '')}</p></div>
        <div class="card"><h4>Innenpolitik</h4><p>${esc(val(d.dom) || '—')}</p></div><div class="card"><h4>Aussenpolitik</h4><p>${esc(val(d.for) || '—')}</p></div>`,
      Geschichte: `<div class="card"><h4>Kontext</h4><p>${esc(val(d.hist) || '—')}</p></div>${(d.hc || []).length ? `<div class="card"><h4>Prägende Konflikte</h4><div class="tl">${d.hc.map(h => `<div style="--c:var(--amber)">${esc(h)}</div>`).join('')}</div></div>` : ''}`,
      Geografie: `<div class="card"><h4>Topografie</h4><p>${esc(val(d.geo) || '—')}</p></div><div class="card"><h4>Strategische Lage</h4><p>${esc(val(d.str) || '—')}</p></div>`,
    };
    openPanel(`${flag(a2Of(a3), 16)} ${esc(n)}`, `
      <div class="chips"><span class="chip" style="color:${RISK_COL[r]}">● ${RISK_TXT[r]}</span><span class="chip" style="color:#ffd6d9">CH-Relevanz ${x}/5</span>${BLOC[a3] ? `<span class="chip">${BLOC[a3]}</span>` : ''}</div>
      <div class="ptabs" id="ctabs">${Object.keys(tabs).map((k, i) => `<button class="${i ? '' : 'on'}" data-k="${k}">${k === 'Schweiz' ? CHX + ' ' : ''}${k}</button>`).join('')}</div><div id="cbody"></div>`, true);
    const show = (k) => { $('#cbody').innerHTML = tabs[k]; document.querySelectorAll('#ctabs button').forEach(b => b.classList.toggle('on', b.dataset.k === k)); bindLinks(); };
    document.querySelectorAll('#ctabs button').forEach(b => b.onclick = () => show(b.dataset.k)); show('Lage');
    const f = D.G.features.find(f => f.properties.a3 === a3);
    if (f) { const b = L.geoJSON(f).getBounds(); map.flyToBounds(b, { maxZoom: 6, duration: 1.1, paddingTopLeft: innerWidth >= 820 ? [20, 20] : [20, 20], paddingBottomRight: innerWidth >= 820 ? [20, 20] : [20, innerHeight * .45] }); }
  });
}
function openConflict(id) {
  push(() => {
    const c = D.C.find(x => x.id === id); if (!c) return;
    const evs = D.E.map((e, i) => [e, i]).filter(([e]) => e.c === id).sort((a, b) => (b[0].d || '').localeCompare(a[0].d || '')).map(([, i]) => i);
    openPanel(esc(c.name), `
      <div class="chips"><span class="chip" style="color:${INT_COL[c.intensity]}">● ${INT_TXT[c.intensity]}</span><span class="chip">${esc(c.type)}</span>${c.since ? `<span class="chip">seit ${fmtDate(c.since)}</span>` : ''}</div>
      <div class="card"><h4>Lage</h4><p><b style="color:${INT_COL[c.intensity]}">${esc(c.status)}</b></p><p style="margin-top:6px">${esc(c.summary || '')}</p>${c.tote2026 ? `<p class="muted" style="margin-top:6px;font-size:12px">Tote: ${esc(c.tote2026)}</p>` : ''}${id === 'ukr' && S.uaLive ? `<p class="muted" style="font-size:11px;margin-top:6px">Front live (DeepStateMap), Stand ${esc(S.uaLive)}</p>` : ''}</div>
      ${D.imp[id] ? `<div class="card ch"><h4>${CHX} Bedeutung für die Schweiz</h4><p>${esc(D.imp[id])}</p></div>` : ''}
      <div class="card"><h4>Lageverlauf</h4><div class="tl">${(c.updates || []).slice(0, 14).map(u => `<div style="--c:${INT_COL[c.intensity]}"><div class="d">${fmtDate(u.date)} · ${esc(u.tag || '')}${srcA(u.src)}</div>${esc(u.text)}</div>`).join('')}</div></div>
      ${evs.length ? `<div class="card" style="padding-bottom:4px"><h4>Getroffene Orte (${evs.length})</h4>${evs.map(evRow).join('')}</div>` : ''}
      <div class="card"><h4>Beteiligte Staaten</h4><div class="chips">${c.countries.map(a3 => `<button class="chip btn" data-co="${a3}">${flag(a2Of(a3))} ${esc(nameOf(a3))}</button>`).join('')}</div></div>`, true);
    const z = D.Z.zones.features.filter(f => f.properties.cid === id);
    const b = id === 'ukr' ? L.latLngBounds([[44, 29], [52.5, 41]]) : z.length ? L.geoJSON({ type: 'FeatureCollection', features: z }).getBounds() : null;
    const pad = { paddingTopLeft: [20, 20], paddingBottomRight: [20, innerWidth < 820 ? innerHeight * .45 : 20] };
    b ? map.flyToBounds(b, { maxZoom: 7, duration: 1.1, ...pad }) : map.flyTo([c.center[1], c.center[0]], 5, { duration: 1.1 });
  });
}
function openEvent(i) {
  push(() => {
    const e = D.E[i], [lab, col] = EV[e.t] || EV.luft, c = D.C.find(x => x.id === e.c);
    openPanel(esc(e.title), `
      <div class="chips"><span class="chip" style="color:${col}">● ${lab}</span><span class="chip">${fmtDate(e.d)}</span><span class="chip mono">${e.coords[1].toFixed(3)}°, ${e.coords[0].toFixed(3)}°</span></div>
      ${e.cas ? `<div class="card" style="border-color:${col}66"><h4>Opfer / Schaden</h4><p style="font-weight:600;color:#ffd0d4">${esc(e.cas)}</p></div>` : ''}
      <div class="card"><h4>Ereignis</h4><p>${esc(e.txt)}${srcA(e.src)}</p></div>
      ${c ? `<div class="card" style="padding-bottom:4px"><h4>Konflikt</h4><div class="row" data-c="${c.id}"><span class="dot" style="background:${INT_COL[c.intensity]}"></span><div><div class="t">${esc(c.name)}</div><div class="s">${esc(c.status)}</div></div></div></div>` : ''}`, true);
    map.flyTo([e.coords[1], e.coords[0]], e.t === 'flughafen' ? 13 : 10, { duration: 1.3 });
  });
}
function renderTicker() {
  const items = D.news.map(n => `<span ${n.c ? `data-c="${n.c}"` : ''} style="cursor:pointer"><span class="tag">${esc(n.tag)}</span>${esc(n.text)}</span>`).join('<span class="muted">◆</span>');
  $('#track').innerHTML = items + '<span class="muted">◆</span>' + items;
  $('#track').querySelectorAll('[data-c]').forEach(el => el.onclick = () => openConflict(el.dataset.c));
}
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3500); }
(async function start() {
  if (!('DecompressionStream' in window)) { $('#loadmsg').textContent = 'Dieser Browser ist zu alt (benötigt Chrome/Edge/Firefox/Safari ab 2023).'; return; }
  try {
    await loadPayload(); mergeData();
    $('#stand').textContent = 'Stand ' + S.stamp.toLocaleString('de-CH', { dateStyle: 'medium', timeStyle: 'short' });
    initMap(); renderTicker();
    document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => setTab(b.dataset.v));
    $('#bmBtn').onclick = () => { S.bm = { auto: 'sat', sat: 'dark', dark: 'auto' }[S.bm]; applyBase(); toast({ auto: 'Karte: Automatisch (dunkel → Satellit beim Zoomen)', sat: 'Karte: Satellit', dark: 'Karte: Dunkel' }[S.bm]); };
    if (innerWidth >= 820) setTab('conf');
    addEventListener('resize', () => { setTimeout(() => map.invalidateSize(), 50); });
    $('#loading').classList.add('hide');
  } catch (e) { console.error(e); $('#loadmsg').textContent = 'Fehler beim Laden: ' + e.message; }
})();
</script>
